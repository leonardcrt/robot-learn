[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-learn"
version = "0.1.0"
description = "Navigation d'un robot différentiel 2D : expert écrit à la main vs behavior cloning (+DAgger) vs PPO."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "matplotlib>=3.8",
    "pillow>=10",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["env", "expert", "models", "bc", "rl", "eval"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["ros2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
